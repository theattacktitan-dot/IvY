<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ivy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #79c0ff;
      margin-bottom: 8px;
    }

    p.tagline {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    #mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #1f6feb;
      color: white;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      transition: background 0.2s, transform 0.1s;
    }

    #mic-btn:active {
      transform: scale(0.95);
    }

    #mic-btn.listening {
      background: #da3633;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(218,54,51,0.5); }
      70% { box-shadow: 0 0 0 20px rgba(218,54,51,0); }
      100% { box-shadow: 0 0 0 0 rgba(218,54,51,0); }
    }

    #heard, #status {
      max-width: 320px;
      font-size: 0.95rem;
      padding: 10px 16px;
      border-radius: 8px;
      background: #161b22;
      border: 1px solid #21262d;
      margin-top: 8px;
      min-height: 20px;
    }

    #heard { color: #79c0ff; }
    #status { color: #56d364; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>IvY</h1>
  <p class="tagline">Tap to speak</p>

  <button id="mic-btn">🎤</button>

  <div id="heard">—</div>
  <div id="status">Ready</div>

  <script src="capacitor.js"></script>
  <script>
    const { SpeechRecognition } = Capacitor.Plugins;
    const { TextToSpeech } = Capacitor.Plugins;

    const micBtn = document.getElementById('mic-btn');
    const heard = document.getElementById('heard');
    const status = document.getElementById('status');

    async function speak(text) {
      status.textContent = 'Speaking...';
      try {
        await TextToSpeech.speak({
          text: text,
          lang: 'en-US',
          rate: 1.0,
          pitch: 1.0,
          volume: 1.0
        });
      } catch (err) {
        status.textContent = 'TTS error: ' + err.message;
      }
      status.textContent = 'Ready';
    }

    async function listen() {
      try {
        const perm = await SpeechRecognition.checkPermissions();
        if (perm.speechRecognition !== 'granted') {
          const req = await SpeechRecognition.requestPermissions();
          if (req.speechRecognition !== 'granted') {
            status.textContent = 'Microphone permission denied';
            return;
          }
        }

        micBtn.classList.add('listening');
        status.textContent = 'Listening...';
        heard.textContent = '—';

        const result = await SpeechRecognition.start({
          language: 'en-US',
          maxResults: 1,
          partialResults: false,
          popup: false
        });

        micBtn.classList.remove('listening');

        const text = result?.matches?.[0] || '(nothing heard)';
        heard.textContent = text;

        await speak('You said: ' + text);

      } catch (err) {
        micBtn.classList.remove('listening');
        status.textContent = 'Error: ' + err.message;
      }
    }

    micBtn.addEventListener('click', listen);
  </script>
</body>
</html>
