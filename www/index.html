<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ivy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #79c0ff;
      margin-bottom: 8px;
    }

    p.tagline {
      color: #8b949e;
      font-size: 0.9rem;
      margin-bottom: 36px;
    }

    #mic-btn {
      width: 110px;
      height: 110px;
      border-radius: 50%;
      border: none;
      background: #1f6feb;
      color: white;
      font-size: 2.2rem;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 28px;
      transition: background 0.2s, transform 0.1s;
    }

    #mic-btn:active { transform: scale(0.95); }

    #mic-btn.listening {
      background: #da3633;
      animation: pulse 1.2s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(218,54,51,0.5); }
      70% { box-shadow: 0 0 0 20px rgba(218,54,51,0); }
      100% { box-shadow: 0 0 0 0 rgba(218,54,51,0); }
    }

    #heard, #status {
      max-width: 320px;
      font-size: 0.95rem;
      padding: 10px 16px;
      border-radius: 8px;
      background: #161b22;
      border: 1px solid #21262d;
      margin-top: 8px;
      min-height: 20px;
    }

    #heard { color: #79c0ff; }
    #status { color: #56d364; font-size: 0.8rem; }
  </style>
</head>
<body>
  <h1>IvY</h1>
  <p class="tagline">Tap to speak</p>

  <button id="mic-btn">🎤</button>

  <div id="heard">—</div>
  <div id="status">Ready</div>

  <script src="capacitor.js"></script>
  <script>
    const { SpeechRecognition, TextToSpeech, LocalNotifications, Alarm } = Capacitor.Plugins;

    const micBtn = document.getElementById('mic-btn');
    const heard = document.getElementById('heard');
    const status = document.getElementById('status');

    const REMINDER_CHANNEL_ID = 'ivy_reminders';
    let notifCounter = 1000;
    let channelReady = false;

    async function ensureReminderChannel() {
      if (channelReady) return;
      try {
        await LocalNotifications.createChannel({
          id: REMINDER_CHANNEL_ID,
          name: 'Ivy Reminders',
          description: 'Reminders scheduled by Ivy',
          importance: 5,
          sound: undefined,
          vibration: true
        });
        channelReady = true;
      } catch (err) {
        // Channel creation can fail harmlessly if it already exists
        channelReady = true;
      }
    }

    async function speak(text) {
      status.textContent = 'Speaking...';
      try {
        await TextToSpeech.speak({ text, lang: 'en-US', rate: 1.0, pitch: 1.0, volume: 1.0 });
      } catch (err) {
        status.textContent = 'TTS error: ' + err.message;
      }
      status.textContent = 'Ready';
    }

    // Parses "6", "6:30", "6 am", "6:30 pm", "18:00" into {hour, minute} in 24h time
    function parseTime(str) {
      const match = str.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/i);
      if (!match) return null;
      let hour = parseInt(match[1], 10);
      const minute = match[2] ? parseInt(match[2], 10) : 0;
      const period = match[3] ? match[3].toLowerCase() : null;

      if (period === 'pm' && hour < 12) hour += 12;
      if (period === 'am' && hour === 12) hour = 0;

      if (hour > 23 || minute > 59) return null;
      return { hour, minute };
    }

    function nextOccurrence(hour, minute, forceTomorrow) {
      const now = new Date();
      const target = new Date();
      target.setHours(hour, minute, 0, 0);
      if (forceTomorrow || target <= now) {
        target.setDate(target.getDate() + 1);
      }
      return target;
    }

    async function scheduleReminderNotification(title, body, fireDate) {
      await ensureReminderChannel();
      const perm = await LocalNotifications.checkPermissions();
      if (perm.display !== 'granted') {
        const req = await LocalNotifications.requestPermissions();
        if (req.display !== 'granted') {
          await speak('I need notification permission to set that.');
          return false;
        }
      }
      notifCounter++;
      await LocalNotifications.schedule({
        notifications: [{
          id: notifCounter,
          title,
          body,
          channelId: REMINDER_CHANNEL_ID,
          schedule: { at: fireDate }
        }]
      });
      return true;
    }

    // Returns a command object if text matches a known pattern, otherwise null
    function parseCommand(text) {
      const lower = text.toLowerCase().trim();

      // "what time is it" / "what's the time" / "current time"
      if (/what(?:'s| is) the time|what time is it|current time/.test(lower)) {
        return { type: 'time' };
      }

      // "set a timer for 10 minutes" / "set a timer for 30 seconds"
      let m = lower.match(/set (?:a |an )?timer for (\d+)\s*(second|seconds|sec|minute|minutes|min)?/);
      if (m) {
        const amount = parseInt(m[1], 10);
        const unit = (m[2] || 'minute').startsWith('sec') ? 'seconds' : 'minutes';
        return { type: 'timer', amount, unit };
      }

      // "set an alarm for 6 am" / "set alarm for 6:30 pm"
      m = lower.match(/set (?:an |a )?alarm for (.+)/);
      if (m) {
        const time = parseTime(m[1]);
        if (time) return { type: 'alarm', time };
      }

      // "remind me tomorrow at 7 to study" / "remind me at 5pm to call mom"
      m = lower.match(/remind me (tomorrow |today )?(?:at )?(.+?) to (.+)/);
      if (m) {
        const dayWord = m[1] ? m[1].trim() : null;
        const time = parseTime(m[2]);
        const task = m[3];
        if (time) {
          return { type: 'reminder', time, task, forceTomorrow: dayWord === 'tomorrow' };
        }
      }

      return null;
    }

    async function runCommand(cmd, rawText) {
      if (cmd.type === 'time') {
        const now = new Date();
        const timeLabel = now.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        await speak(`It's ${timeLabel}.`);
        return;
      }

      if (cmd.type === 'timer') {
        const seconds = cmd.unit === 'seconds' ? cmd.amount : cmd.amount * 60;
        const label = `${cmd.amount} ${cmd.unit}`;
        try {
          await Alarm.createTimer({
            duration: seconds,
            label: 'Ivy Timer',
            android: { skipUi: true }
          });
          await speak(`Timer set for ${label}. It will ring in your clock app.`);
        } catch (err) {
          await speak('I could not set that timer. ' + err.message);
        }
        return;
      }

      if (cmd.type === 'alarm') {
        const timeLabel12 = new Date(0, 0, 0, cmd.time.hour, cmd.time.minute)
          .toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        try {
          await Alarm.createAlarm({
            hour: cmd.time.hour,
            minute: cmd.time.minute,
            label: 'Ivy Alarm',
            android: { skipUi: true }
          });
          await speak(`Alarm set for ${timeLabel12}. It will ring like a normal alarm.`);
        } catch (err) {
          await speak('I could not set that alarm. ' + err.message);
        }
        return;
      }

      if (cmd.type === 'reminder') {
        const fireDate = nextOccurrence(cmd.time.hour, cmd.time.minute, cmd.forceTomorrow);
        const timeLabel = fireDate.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
        const ok = await scheduleReminderNotification(
          `Reminder at ${timeLabel}`,
          cmd.task,
          fireDate
        );
        if (ok) await speak(`I'll remind you to ${cmd.task} at ${timeLabel}.`);
        return;
      }

      // Fallback: no recognized command
      await speak('You said: ' + rawText);
    }

    async function listen() {
      try {
        const perm = await SpeechRecognition.checkPermissions();
        if (perm.speechRecognition !== 'granted') {
          const req = await SpeechRecognition.requestPermissions();
          if (req.speechRecognition !== 'granted') {
            status.textContent = 'Microphone permission denied';
            return;
          }
        }

        micBtn.classList.add('listening');
        status.textContent = 'Listening...';
        heard.textContent = '—';

        const result = await SpeechRecognition.start({
          language: 'en-US',
          maxResults: 1,
          partialResults: false,
          popup: false
        });

        micBtn.classList.remove('listening');

        const text = result?.matches?.[0] || '';
        heard.textContent = text || '(nothing heard)';

        if (!text) {
          status.textContent = 'Ready';
          return;
        }

        const cmd = parseCommand(text);
        if (cmd) {
          await runCommand(cmd, text);
        } else {
          await speak('You said: ' + text);
        }

      } catch (err) {
        micBtn.classList.remove('listening');
        status.textContent = 'Error: ' + err.message;
      }
    }

    micBtn.addEventListener('click', listen);
  </script>
</body>
</html>
