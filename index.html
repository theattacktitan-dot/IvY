<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Ivy</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #0d1117;
      color: #e6edf3;
      font-family: -apple-system, Roboto, sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 24px;
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 300;
      letter-spacing: 4px;
      color: #79c0ff;
      margin-bottom: 12px;
    }

    p {
      color: #8b949e;
      font-size: 0.95rem;
      margin-bottom: 32px;
    }

    #status {
      font-size: 0.8rem;
      color: #56d364;
      border: 1px solid #21262d;
      border-radius: 8px;
      padding: 8px 16px;
      background: #161b22;
    }
  </style>
</head>
<body>
  <h1>IvY</h1>
  <p>Foundation build — pipeline check</p>
  <div id="status">Shell loaded successfully</div>

  <script>
    // Confirms the JS layer is running inside the Capacitor webview.
    document.getElementById('status').textContent =
      'Shell loaded — ' + new Date().toLocaleTimeString();
  </script>
</body>
</html>
